<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="signup-container">
    <h2>Sign Up</h2>

    <form action="https://flightapp.davimast.net/shop" method='POST'>
        <label>Username:</label>
        <input type="text" name="username">

        <label>Password:</label>
        <input type="password" name="password">

        <label>Email:</label>
        <input type="email" name="email">

        <button type="submit">Sign Up</button>
        <p class="bottom-text">
            already signed up?
            <a href="https://flightapp.davimast.net/sign-in">Click here</a>
        </p>        
    </form>
</div>
</body>
</html>
