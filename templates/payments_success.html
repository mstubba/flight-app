<!DOCTYPE html>
<html lang="en">
<head>

    <title>Payment Success</title>

        body {
            background-color: #4CAF50;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: black;
        }

        .container {
            width: 60%;
            margin: 120px auto;
