name: pipeline

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  application:
    name: build-and-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wczytaj konfigurację z gcp.env
        run: cat gcp.env >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          IMAGE="$AR_REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$IMAGE_NAME"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Push image to Artifact Registry
        run: |
          gcloud auth configure-docker "$AR_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Deploy to GKE
        run: |
          sed -i "s|$IMAGE:latest|$IMAGE:$GITHUB_SHA|" k8s/flask.yaml
          grep -q "$IMAGE:$GITHUB_SHA" k8s/flask.yaml \
            || { echo "::error::W k8s/flask.yaml nie znaleziono $IMAGE:latest"; exit 1; }
          kubectl apply -f k8s/
          kubectl annotate deployment/"$DEPLOYMENT_NAME" \
            kubernetes.io/change-cause="commit $GITHUB_SHA" --overwrite
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" --timeout=180s